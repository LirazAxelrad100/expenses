<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Expenses">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Expenses</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Expenses</h1>
  <div id="monthTotal" class="total">€0.00</div>
  <div class="totalLabel">this month</div>
</header>

<main>

  <form id="expenseForm">
    <div class="fieldRow">
      <input type="number" id="amount" step="0.01" min="0" placeholder="Amount" required>
      <select id="bucket" required></select>
    </div>

    <label class="checkboxRow">
      <input type="checkbox" id="splitToggle">
      This purchase covers more than one bucket
    </label>

    <div id="splitRows" style="display:none"></div>
    <button type="button" id="addSplitRowBtn" style="display:none">+ Add another bucket</button>

    <label class="dateRow">
      Date
      <input type="date" id="date" required>
    </label>

    <input type="text" id="item" placeholder="Item (optional)">
    <input type="text" id="place" placeholder="Where (optional)">
    <input type="text" id="notes" placeholder="Notes (optional)">
    <button type="submit" id="submitBtn">Add expense</button>
    <button type="button" id="cancelEditBtn" style="display:none">Cancel edit</button>
  </form>

  <section id="breakdown">
    <h2>This month by bucket</h2>
    <ul id="breakdownList"></ul>
    <a href="report.html" class="reportLink">View past months →</a>
  </section>

  <section id="recent">
    <h2>This month's expenses</h2>
    <ul id="recentList"></ul>
    <button type="button" id="showMoreExpenses" class="linkBtn" style="display:none"></button>
  </section>

  <details id="manageBuckets">
    <summary>Manage buckets</summary>
    <ul id="bucketList"></ul>
    <form id="addBucketForm">
      <input type="text" id="newBucketName" placeholder="New bucket name" required>
      <button type="submit">Add bucket</button>
    </form>
  </details>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
